name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json pins, so CI cannot drift from local
      # installs. tailwindcss@3 is already pinned in devDependencies — no extra install needed.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l main.go server/)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./server/... .

      # -race is what catches concurrent writers racing on article version assignment; the
      # storage tests exercise that path directly.
      - name: Run tests (race detector)
        run: go test -race -v ./server/... .

      - name: Verify binary compiles
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o nexwiki main.go

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The image was previously only ever built by release.yml, on a tag push — so a Dockerfile
      # that could not build was invisible until after the tag existed. It happened: a leftover
      # `RUN npm install -D tailwindcss@3` silently overrode package.json, and the Tailwind v4
      # migration broke the container build while every other check stayed green.
      #
      # Build only, no push: this runs on pull requests, which must not publish anything. Loading
      # the image into the local daemon is what lets the smoke test below actually run it.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: nexwiki:ci
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not enough — a stale or wrongly-pinned frontend toolchain produces an image
      # that builds and then serves the wrong assets. This asserts the container actually answers
      # and that the stylesheet it embeds is the one the source describes.
      - name: Smoke-test the image
        run: |
          docker run -d --name nexwiki-ci -p 8080:8080 nexwiki:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/articles >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/articles >/dev/null || {
            echo "container never served /api/articles"; docker logs nexwiki-ci; exit 1; }
          css_path=$(curl -sf http://127.0.0.1:8080/ | grep -o '/assets/[^"]*\.css' | head -1)
          [ -n "$css_path" ] || { echo "index.html references no stylesheet"; exit 1; }
          css=$(curl -sf "http://127.0.0.1:8080$css_path")
          for token in bg-themeBgPrimary text-themeTextMuted --color-themeBgPrimary; do
            echo "$css" | grep -q -- "$token" || {
              echo "embedded stylesheet is missing $token — the frontend build is wrong"; exit 1; }
          done
          echo "container serves the expected frontend assets"
          docker rm -f nexwiki-ci

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./server/... .

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    # Advisory only for now: golangci-lint has not been triaged against this codebase yet, so a
    # finding should surface in the PR without blocking the merge. Flip to a required check once
    # the existing findings are cleared.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # frontend/dist is gitignored, so //go:embed frontend/dist/* fails to typecheck on a fresh
      # checkout. Linting Go doesn't need the real assets, so stub the directory rather than
      # paying for an npm ci + vite build here.
      - name: Stub embedded frontend assets
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>lint stub</title>' > frontend/dist/index.html

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint v1 is built with Go 1.24 and refuses to lint a module targeting
          # go 1.26; the v2 line is required here.
          version: v2.12.2
          # "." rather than main.go: a named .go file can't be mixed with a package pattern.
          # Listed explicitly instead of ./... to skip frontend/node_modules.
          args: --timeout=5m . ./server/...

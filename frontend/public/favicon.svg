<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Welcome to NexWiki gradient (#4f46e5 to #7c3aed) -->
    <linearGradient id="nxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Deep slate squircle card -->
    <radialGradient id="nxBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#18182b" />
      <stop offset="100%" stop-color="#08080f" />
    </radialGradient>

    <filter id="nxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Clean dark squircle base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#nxBg)" stroke="#312e81" stroke-width="1.8" />

  <g fill="url(#nxGrad)" filter="url(#nxShadow)">
    <!-- 
      BOLD, UNMISTAKABLE N:
      Full-height vertical left pillar (x=22..36), steep diagonal spanning 
      corner-to-corner (36,30 to 70,98), and full-height right pillar (x=56..70).
      Pure, classic N anatomy with crisp cuts.
    -->
    <path d="M 22 30 L 36 30 L 36 68 L 56 30 L 70 30 L 70 98 L 56 98 L 56 60 L 36 98 L 22 98 Z" />

    <!-- 
      BOLD, MATCHING X:
      Clean cross matching the N's stroke weight and height, perfectly proportioned on the right.
    -->
    <path d="M 78 40 L 88 40 L 95 55 L 102 40 L 112 40 L 101 64 L 112 88 L 102 88 L 95 73 L 88 88 L 78 88 L 89 64 Z" />
  </g>
</svg>